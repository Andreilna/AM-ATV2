[project]
name = "am-atv2"
version = "0.1.0"
description = "Pipeline MLP para classificação de sobrevivência e API de inferência FastAPI"
readme = "README.md"
authors = [
    { name = "Andreilna", email = "andreialda7@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "joblib>=1.6.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pydantic>=2.14.4",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
am-atv2 = "am_atv2:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
